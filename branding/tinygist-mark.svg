<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-labelledby="title description">
  <title id="title">tinyGist contribution mark</title>
  <desc id="description">Two tiny microcontrollers exchange an importance-selected sparse model segment without a central server.</desc>

  <defs>
    <marker id="arrow-primary" viewBox="0 0 10 10" refX="9" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#870074"/>
    </marker>
    <marker id="arrow-secondary" viewBox="0 0 10 10" refX="9" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C86DB8"/>
    </marker>
  </defs>

  <!-- Square avatar background with consistent edge padding. -->
  <rect id="avatar-background" x="2" y="2" width="508" height="508"
        fill="#FFFFFF" stroke="#F0DEEC" stroke-width="4"/>

  <g id="contribution-mark">
    <g id="source-microcontroller">
      <g id="source-pins" fill="none" stroke="#870074" stroke-width="9" stroke-linecap="round">
        <path d="M130 185 V166 M205 185 V166 M130 385 V404 M205 385 V404"/>
        <path d="M85 230 H66 M85 285 H66 M85 340 H66"/>
        <path d="M250 225 H269 M250 345 H269"/>
      </g>
      <rect id="source-chip-body" x="85" y="185" width="165" height="200" rx="34"
            fill="#FFFFFF" stroke="#870074" stroke-width="9"/>

      <g id="source-model" stroke="#870074" stroke-width="2">
        <g id="importance-low" fill="#F0DEEC">
          <rect x="108" y="215" width="21" height="21" rx="4"/>
          <rect x="174" y="215" width="21" height="21" rx="4"/>
          <rect x="207" y="248" width="21" height="21" rx="4"/>
          <rect x="108" y="281" width="21" height="21" rx="4"/>
          <rect x="174" y="281" width="21" height="21" rx="4"/>
          <rect x="141" y="314" width="21" height="21" rx="4"/>
          <rect x="207" y="314" width="21" height="21" rx="4"/>
        </g>
        <g id="importance-medium" fill="#C86DB8">
          <rect x="141" y="215" width="21" height="21" rx="4"/>
          <rect x="108" y="248" width="21" height="21" rx="4"/>
          <rect x="174" y="248" width="21" height="21" rx="4"/>
          <rect x="141" y="281" width="21" height="21" rx="4"/>
          <rect x="207" y="281" width="21" height="21" rx="4"/>
          <rect x="174" y="314" width="21" height="21" rx="4"/>
        </g>
        <g id="importance-high" fill="#870074">
          <rect x="207" y="215" width="21" height="21" rx="4"/>
          <rect x="141" y="248" width="21" height="21" rx="4"/>
          <rect x="108" y="314" width="21" height="21" rx="4"/>
        </g>
      </g>
    </g>

    <g id="receiver-microcontroller">
      <g id="receiver-pins" fill="none" stroke="#870074" stroke-width="8" stroke-linecap="round">
        <path d="M345 105 V88 M390 105 V88 M345 245 V262 M390 245 V262"/>
        <path d="M315 140 H298 M315 210 H298 M420 140 H437 M420 175 H437 M420 210 H437"/>
      </g>
      <rect id="receiver-chip-body" x="315" y="105" width="105" height="140" rx="27"
            fill="#FFFFFF" stroke="#870074" stroke-width="8"/>
      <g id="receiver-model" stroke="#870074" stroke-width="1.8">
        <rect x="337" y="137" width="14" height="14" rx="3" fill="#F0DEEC"/>
        <rect x="361" y="137" width="14" height="14" rx="3" fill="#870074"/>
        <rect x="385" y="137" width="14" height="14" rx="3" fill="#C86DB8"/>
        <rect x="337" y="164" width="14" height="14" rx="3" fill="#C86DB8"/>
        <rect x="361" y="164" width="14" height="14" rx="3" fill="#F0DEEC"/>
        <rect x="385" y="164" width="14" height="14" rx="3" fill="#870074"/>
        <rect x="337" y="191" width="14" height="14" rx="3" fill="#870074"/>
        <rect x="361" y="191" width="14" height="14" rx="3" fill="#C86DB8"/>
        <rect x="385" y="191" width="14" height="14" rx="3" fill="#F0DEEC"/>
      </g>
    </g>

    <g id="peer-to-peer-exchange" fill="none" stroke-linecap="round">
      <path id="outgoing-link" d="M260 211 C271 162 293 146 309 166"
            stroke="#870074" stroke-width="7" marker-end="url(#arrow-primary)"/>
      <path id="return-link" d="M356 255 C361 323 311 370 265 346"
            stroke="#C86DB8" stroke-width="7" marker-end="url(#arrow-secondary)"/>
    </g>

    <!-- The compact transmitted gist: sparse values selected by importance. -->
    <g id="transmitted-gist" transform="translate(264 256)">
      <rect width="43" height="39" rx="11" fill="#FFFFFF" stroke="#870074" stroke-width="5"/>
      <rect x="8" y="11" width="7" height="17" rx="2.5" fill="#870074"/>
      <rect x="18" y="11" width="7" height="17" rx="2.5" fill="#C86DB8"/>
      <rect x="28" y="11" width="7" height="17" rx="2.5" fill="#870074"/>
    </g>
  </g>
</svg>
