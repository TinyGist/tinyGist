schema_version: 2

experiment:
  task: classification
  seed: 42

federation:
  rounds: 200
  clients:
    count: 10

dataset:
  name: cifar10
  partition:
    samples_per_client: 3000
    labels_per_client: 5
    label_assignment:
      strategy: loop
      loop_step: 3
    sample_assignment:
      strategy: dirichlet
      dirichlet_alpha: 100
  evaluation:
    test_samples: 3010
    validation_samples: 1010
  batches:
    train_size: 100
    test_size: 100
    validation_size: 100

model:
  name: MobileNetV4Small
  input_size: 3
  num_classes: 10

training:
  optimizer:
    name: adam_cross_round
    learning_rate: 0.01
    weight_decay: 0
  local:
    epochs_per_round: 3
    max_batches_per_epoch: 3
  loss: cross_entropy

method:
  name: DFA
  segments:
    count: 1
  exchange:
    sends_per_client: 6
    receive_queue:
      aggregation_threshold: 5
      capacity: 50
